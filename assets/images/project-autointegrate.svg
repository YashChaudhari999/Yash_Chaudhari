<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1015"/>
      <stop offset="100%" stop-color="#161922"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d8f26a"/>
      <stop offset="100%" stop-color="#9a8cff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bgGrad)" rx="16"/>
  <rect x="1" y="1" width="798" height="448" fill="none" stroke="#262832" stroke-width="1.5" rx="15"/>

  <!-- Code Editor Window Mockup -->
  <g transform="translate(60, 45)">
    <!-- Terminal Window Frame -->
    <rect width="680" height="360" rx="12" fill="#121318" stroke="#2f3340" stroke-width="1.5"/>
    
    <!-- Window Header -->
    <rect width="680" height="40" rx="12" fill="#181a22"/>
    <rect y="28" width="680" height="12" fill="#181a22"/>
    <line x1="0" y1="40" x2="680" y2="40" stroke="#262832" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="24" cy="20" r="5" fill="#ff5f56"/>
    <circle cx="42" cy="20" r="5" fill="#ffbd2e"/>
    <circle cx="60" cy="20" r="5" fill="#27c93f"/>
    <text x="340" y="24" fill="#726e64" font-family="monospace" font-size="11" text-anchor="middle">library-integration-assistant · npm package analyzer</text>
    
    <!-- Left Pane: Input Spec -->
    <rect x="25" y="60" width="280" height="275" rx="8" fill="#15171f" stroke="#262832"/>
    <text x="45" y="88" fill="#9a8cff" font-family="monospace" font-size="12" font-weight="600">// Target Package</text>
    <rect x="45" y="100" width="240" height="34" rx="6" fill="#1e212b" stroke="#383c4a"/>
    <text x="58" y="122" fill="#f5f3ed" font-family="monospace" font-size="12">npm install axios</text>
    <circle cx="265" cy="117" r="4" fill="#d8f26a"/>
    
    <text x="45" y="160" fill="#726e64" font-family="monospace" font-size="11">// User Codebase Context</text>
    <text x="45" y="185" fill="#d8f26a" font-family="monospace" font-size="11">function fetchProfile(id) {</text>
    <text x="65" y="205" fill="#a19c91" font-family="monospace" font-size="11">fetch(`/api/user/${id}`)</text>
    <text x="85" y="225" fill="#a19c91" font-family="monospace" font-size="11">.then(res => res.json())</text>
    <text x="45" y="245" fill="#d8f26a" font-family="monospace" font-size="11">}</text>

    <!-- Center Connection Arrow -->
    <g transform="translate(320, 180)">
      <circle cx="20" cy="10" r="18" fill="#1e212b" stroke="#9a8cff" stroke-width="1.5"/>
      <path d="M14 10 L24 10 M20 6 L24 10 L20 14" stroke="#d8f26a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Right Pane: AI-Generated Integration -->
    <rect x="375" y="60" width="280" height="275" rx="8" fill="#15171f" stroke="#262832"/>
    <text x="395" y="88" fill="#d8f26a" font-family="monospace" font-size="12" font-weight="600">// Gemma LLM Synthesis</text>
    
    <!-- Synthesized Code Block -->
    <text x="395" y="115" fill="#726e64" font-family="monospace" font-size="11">import axios from 'axios';</text>
    <text x="395" y="140" fill="#9a8cff" font-family="monospace" font-size="11">const client = axios.create({</text>
    <text x="415" y="160" fill="#a19c91" font-family="monospace" font-size="11">timeout: 5000,</text>
    <text x="415" y="180" fill="#a19c91" font-family="monospace" font-size="11">headers: { 'X-App': 'v1' }</text>
    <text x="395" y="200" fill="#9a8cff" font-family="monospace" font-size="11">});</text>
    <text x="395" y="230" fill="#d8f26a" font-family="monospace" font-size="11">export async function fetchProfile(id) {</text>
    <text x="415" y="250" fill="#f5f3ed" font-family="monospace" font-size="11">const { data } = await client.get(`/api/user/${id}`);</text>
    <text x="415" y="270" fill="#f5f3ed" font-family="monospace" font-size="11">return data;</text>
    <text x="395" y="290" fill="#d8f26a" font-family="monospace" font-size="11">}</text>

    <!-- Status Badge -->
    <rect x="495" y="305" width="150" height="22" rx="11" fill="#122b1b" stroke="#4ade80" stroke-width="1"/>
    <text x="570" y="319" fill="#4ade80" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">✓ Context-Aware Diff</text>
  </g>
</svg>
