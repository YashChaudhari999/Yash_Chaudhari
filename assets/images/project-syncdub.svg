<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171f"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a8cff"/>
      <stop offset="50%" stop-color="#d9f27a"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="760" height="440" rx="16" fill="#181c24" stroke="#2a303c" stroke-width="2"/>

  <!-- Window Header -->
  <rect x="20" y="20" width="760" height="48" rx="16" fill="#12151b"/>
  <circle cx="50" cy="44" r="6" fill="#ef4444" />
  <circle cx="70" cy="44" r="6" fill="#f59e0b" />
  <circle cx="90" cy="44" r="6" fill="#10b981" />
  <text x="120" y="49" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="13" font-weight="500">SyncDub v1.0 · Offline AI Voiceover &amp; Video Dubbing</text>
  <rect x="670" y="32" width="90" height="24" rx="12" fill="#d9f27a" />
  <text x="715" y="48" fill="#151515" font-family="'DM Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">OFFLINE</text>

  <!-- Main Work Area Split -->
  <!-- Left Side: Audio Waveform & TTS Controls -->
  <rect x="45" y="90" width="410" height="345" rx="12" fill="#11141a" stroke="#232833"/>
  
  <text x="70" y="125" fill="#e2e8f0" font-family="'DM Sans', sans-serif" font-size="17" font-weight="600">Local Neural Voice Synthesis</text>
  <text x="70" y="146" fill="#64748b" font-family="'DM Mono', monospace" font-size="12">Piper TTS Engine · 0% Cloud Dependencies</text>

  <!-- Waveform Visualizer -->
  <rect x="70" y="170" width="360" height="110" rx="8" fill="#0c0e12" stroke="#1e2430"/>
  <g fill="url(#waveGrad)">
    <rect x="85" y="215" width="4" height="20" rx="2" />
    <rect x="95" y="200" width="4" height="50" rx="2" />
    <rect x="105" y="190" width="4" height="70" rx="2" />
    <rect x="115" y="210" width="4" height="30" rx="2" />
    <rect x="125" y="185" width="4" height="80" rx="2" />
    <rect x="135" y="175" width="4" height="100" rx="2" />
    <rect x="145" y="195" width="4" height="60" rx="2" />
    <rect x="155" y="205" width="4" height="40" rx="2" />
    <rect x="165" y="180" width="4" height="90" rx="2" />
    <rect x="175" y="190" width="4" height="70" rx="2" />
    <rect x="185" y="215" width="4" height="20" rx="2" />
    <rect x="195" y="185" width="4" height="80" rx="2" />
    <rect x="205" y="178" width="4" height="94" rx="2" />
    <rect x="215" y="192" width="4" height="66" rx="2" />
    <rect x="225" y="208" width="4" height="34" rx="2" />
    <rect x="235" y="182" width="4" height="86" rx="2" />
    <rect x="245" y="176" width="4" height="98" rx="2" />
    <rect x="255" y="190" width="4" height="70" rx="2" />
    <rect x="265" y="202" width="4" height="46" rx="2" />
    <rect x="275" y="184" width="4" height="82" rx="2" />
    <rect x="285" y="196" width="4" height="58" rx="2" />
    <rect x="295" y="212" width="4" height="26" rx="2" />
    <rect x="305" y="188" width="4" height="74" rx="2" />
    <rect x="315" y="177" width="4" height="96" rx="2" />
    <rect x="325" y="194" width="4" height="62" rx="2" />
    <rect x="335" y="206" width="4" height="38" rx="2" />
    <rect x="345" y="181" width="4" height="88" rx="2" />
    <rect x="355" y="193" width="4" height="64" rx="2" />
    <rect x="365" y="214" width="4" height="22" rx="2" />
    <rect x="375" y="198" width="4" height="54" rx="2" />
    <rect x="385" y="186" width="4" height="78" rx="2" />
    <rect x="395" y="210" width="4" height="30" rx="2" />
    <rect x="405" y="218" width="4" height="14" rx="2" />
  </g>

  <!-- Controls row -->
  <rect x="70" y="300" width="110" height="34" rx="6" fill="#1e2430"/>
  <text x="125" y="322" fill="#e2e8f0" font-family="'DM Mono', monospace" font-size="12" text-anchor="middle">Whisper Tiny</text>
  
  <rect x="195" y="300" width="110" height="34" rx="6" fill="#1e2430"/>
  <text x="250" y="322" fill="#e2e8f0" font-family="'DM Mono', monospace" font-size="12" text-anchor="middle">Auto-Sync SRT</text>

  <rect x="320" y="300" width="110" height="34" rx="6" fill="#d9f27a"/>
  <text x="375" y="322" fill="#151515" font-family="'DM Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">Generate</text>

  <!-- Timeline progress bar -->
  <rect x="70" y="355" width="360" height="8" rx="4" fill="#1e2430"/>
  <rect x="70" y="355" width="240" height="8" rx="4" fill="#9a8cff"/>
  <circle cx="310" cy="359" r="7" fill="#ffffff" filter="url(#glow)"/>
  <text x="70" y="385" fill="#64748b" font-family="'DM Mono', monospace" font-size="11">01:24.08 / 02:18.50</text>
  <text x="430" y="385" fill="#d9f27a" font-family="'DM Mono', monospace" font-size="11" text-anchor="end">Hardware: CPU Mode (AVX2)</text>

  <!-- Right Side: Video Preview & Subtitle stream -->
  <rect x="475" y="90" width="280" height="345" rx="12" fill="#11141a" stroke="#232833"/>
  
  <!-- Video frame preview -->
  <rect x="495" y="110" width="240" height="140" rx="8" fill="#0a0c10" stroke="#1e2430"/>
  <circle cx="615" cy="180" r="26" fill="#1e2430" opacity="0.8"/>
  <polygon points="610,170 625,180 610,190" fill="#d9f27a"/>
  
  <!-- Subtitle Overlay banner -->
  <rect x="515" y="215" width="200" height="24" rx="4" fill="#000000" opacity="0.85"/>
  <text x="615" y="231" fill="#ffffff" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500" text-anchor="middle">"Generating voiceover locally in real-time."</text>

  <!-- Subtitle script blocks -->
  <rect x="495" y="265" width="240" height="46" rx="6" fill="#161b24" stroke="#232936"/>
  <text x="510" y="285" fill="#9a8cff" font-family="'DM Mono', monospace" font-size="10">00:00:12,400 --&gt; 00:00:15,800</text>
  <text x="510" y="301" fill="#cbd5e1" font-family="'DM Sans', sans-serif" font-size="12">Natural phrasing synchronized</text>

  <rect x="495" y="320" width="240" height="46" rx="6" fill="#1c222e" stroke="#9a8cff" stroke-width="1.5"/>
  <text x="510" y="340" fill="#d9f27a" font-family="'DM Mono', monospace" font-size="10">00:00:15,800 --&gt; 00:00:18,200</text>
  <text x="510" y="356" fill="#ffffff" font-family="'DM Sans', sans-serif" font-size="12" font-weight="600">Zero latency audio track mix</text>

  <rect x="495" y="375" width="240" height="46" rx="6" fill="#161b24" stroke="#232936"/>
  <text x="510" y="395" fill="#64748b" font-family="'DM Mono', monospace" font-size="10">00:00:18,200 --&gt; 00:00:21,500</text>
  <text x="510" y="411" fill="#94a3b8" font-family="'DM Sans', sans-serif" font-size="12">Export final MP4 with embedded SRT</text>
</svg>
